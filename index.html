<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f2f2f2;
    }

    h1 {
        color: #333;
    }

    div {
        margin-bottom: 15px;
    }

    input, select, button {
        padding: 8px;
        margin-left: 10px;
    }

    button {
        cursor: pointer;
    }

    #validationMessage {
        color: red;
    }

    #orderSummary {
        margin-top: 20px;
        padding: 15px;
        background-color: white;
    }
    </style>

</head>
<body>

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <div>
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName">
    </div>

    <div>
        <label for="productCount">Number of Products</label>
        <input type="text" id="productCount">
    </div>

    <div id="productsContainer"></div>

    <div>
        <label for="deliveryOption">Delivery Option</label>
        <select id="deliveryOption">
            <option value="1">Store Pickup</option>
            <option value="2">Standard Delivery</option>
            <option value="3">Express Delivery</option>
        </select>
    </div>

    <div id="validationMessage"></div>

    <button id="calculateBtn">Calculate Order</button>

    <div id="orderSummary"></div>

    <script src="script.js"></script>
</body>
</html>
