<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f2f2f2;
    }

    h1 {
        color: #333;
    }

    div {
        margin-bottom: 15px;
    }

    input, select, button {
        padding: 8px;
        margin-left: 10px;
    }
    .product-block {
        background-color: white;
        padding: 20px;
        margin: 15px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 500px;
    }

    .product-block h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #333;
    }

    .product-block label {
        display: block;
        margin: 10px 0 5px 0;
    }

    .product-block input {
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 8px;
    }

    button {
        cursor: pointer;
    }

    #validationMessage {
        color: red;
    }

    #orderSummary {
        margin-top: 20px;
        padding: 20px;
        background-color: white;
        border: 1px solid #333;
        border-radius: 0;
        width: 450px;
        white-space: pre-wrap;
        font-family: monospace;
        line-height: 1.5;
    }

    #calculateBtn {
        padding: 10px 20px;
        margin-top: 10px;
        cursor: pointer;
    }

    #calculateBtn:hover {
        background-color: #eee;
    }
    </style>

</head>
<body>

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <div>
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName">
    </div>

    <div>
        <label for="productCount">Number of Products</label>
        <input type="text" id="productCount">
    </div>

    <div id="productsContainer"></div>

    <div>
        <label for="deliveryOption">Delivery Option</label>
        <select id="deliveryOption">
            <option value="1">Store Pickup</option>
            <option value="2">Standard Delivery</option>
            <option value="3">Express Delivery</option>
        </select>
    </div>

    <div id="validationMessage"></div>

    <button id="calculateBtn">Calculate Order</button>

    <div id="orderSummary"></div>

    <script src="script.js"></script>
</body>
</html>
